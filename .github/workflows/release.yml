---
name: Create Game Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'Sinclair Secrets by Miracle/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create ZIP of game files
        run: |
          cd "Sinclair Secrets by Miracle"
          zip -r "../Sinclair-Secrets-Game.zip" .
          cd ..
          ls -lh Sinclair-Secrets-Game.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Sinclair's Secrets ${{ steps.tag.outputs.tag_name }}
          body: |
            ## Download and Play Sinclair's Secrets

            **An intense first-person horror game where the goal is to
            escape the asylum.**

            ### How to Play:
            1. Download the `Sinclair-Secrets-Game.zip` file below
            2. Extract the ZIP file to a folder on your computer
            3. Navigate to the extracted folder: `Sinclair Secrets by Miracle`
            4. Run `Sinclair's Secrets.exe` to start the game

            ### System Requirements:
            - Windows 7 or later
            - DirectX 11 compatible graphics card
            - 2GB RAM minimum

            **DEMONSTRATION VIDEO:**
            [Watch the demonstration video here](
            https://drive.google.com/file/d/1MqMA2XISvSmrQs6V5t1Z1uUbfSf5L-tS/view?usp=sharing)
          files: Sinclair-Secrets-Game.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
